[project]
name = "ansbach-votes"
version = "0.2.0"
description = "Hyperlocal (Stimmbezirk-level) analysis of election results in Ansbach"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
maps = ["folium>=0.15", "matplotlib>=3.7"]
notebook = ["folium>=0.15", "matplotlib>=3.7", "jupyter"]
dev = ["pytest>=7", "folium>=0.15", "matplotlib>=3.7"]

[project.scripts]
ansbach-votes = "ansbach_votes.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ansbach_votes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
